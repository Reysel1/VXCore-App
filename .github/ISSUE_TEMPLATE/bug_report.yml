name: Error
description: Algo no funciona como debería
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: Qué pasa
      description: Qué esperabas y qué ocurre en su lugar.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. Abre...
        2. Pulsa...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versión de VXCore
      placeholder: "0.10.1"
    validations:
      required: true
  - type: dropdown
    id: part
    attributes:
      label: Parte afectada
      options: [Panel, Agente, App de escritorio, Recurso in-game]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Quita tokens, contraseñas e IPs antes de pegarlos.
      render: text
